services:
  - type: web
    name: persona-pulse-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free                    # change to "starter" to avoid cold starts
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false               # set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true       # Render auto-generates a secure random value
      - key: APP_URL
        sync: false               # e.g. https://your-app.vercel.app
      - key: API_URL
        sync: false               # e.g. https://persona-pulse-ai-backend.onrender.com
      - key: COOKIE_SAMESITE
        value: none               # required for cross-site cookies (Vercel + Render)
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-1.5-flash
      - key: AI_PAID_TIER
        value: "false"
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
      - key: FREE_RUNS_PER_MONTH
        value: "15"
      - key: PRO_RUNS_PER_MONTH
        value: "300"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
